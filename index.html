<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>東京都 教育施設マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#1e293b;background:#f5f7fb}.app{display:flex;height:100dvh;min-height:450px}.sidebar{width:330px;flex:none;padding:22px 18px;overflow:auto;background:#fff;box-shadow:2px 0 14px #0f172a12;z-index:1000}.sidebar h1{font-size:21px;margin:0 0 6px}.muted{color:#64748b;font-size:12px;line-height:1.6}.stat{background:#eff6ff;border-radius:12px;padding:13px;margin:17px 0}.stat strong{font-size:26px;color:#1d4ed8}.field{margin:16px 0}.field label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}input[type=search]{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:14px}.actions{display:flex;gap:8px;margin:12px 0}button,.filebtn{cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 11px;font-size:13px;color:#334155}button:hover,.filebtn:hover{background:#f1f5f9}.types{display:grid;gap:2px}.type{display:flex;align-items:center;gap:9px;padding:7px 5px;border-radius:7px;font-size:13px;cursor:pointer}.type:hover{background:#f8fafc}.type input{accent-color:#2563eb}.dot{width:11px;height:11px;border-radius:50%;flex:none}.type .count{margin-left:auto;color:#64748b;font-variant-numeric:tabular-nums}#map{flex:1;min-width:0}.status{font-size:12px;color:#64748b;line-height:1.5;margin-top:12px}.error{color:#b91c1c}.filebtn{display:inline-block;margin-top:9px}#fileInput{display:none}.pin{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 6px #0005}.popup-title{font-weight:700;font-size:15px;margin-bottom:8px}.popup-line{font-size:13px;line-height:1.65}.popup-code{font-size:11px;color:#64748b;margin-top:6px}@media(max-width:700px){.app{flex-direction:column}.sidebar{width:100%;height:43dvh;min-height:240px;padding:14px;box-shadow:none}.sidebar h1{font-size:18px}.stat{margin:9px 0;padding:7px 10px}.stat strong{font-size:20px}#map{min-height:57dvh}.types{grid-template-columns:1fr 1fr}.type{font-size:12px}}
</style>
</head>
<body><div class="app"><aside class="sidebar"><h1>東京都 教育施設マップ</h1><div class="muted">GeoJSON：P29-23_13.geojson</div><div class="stat"><strong id="visible">—</strong><span> 件を表示</span><div class="muted" id="total">データを読み込み中…</div></div><div class="field"><label for="search">学校名・住所を検索</label><input type="search" id="search" placeholder="例：中央区、早稲田、小学校"></div><div class="actions"><button id="all">すべて選択</button><button id="none">すべて解除</button><button id="fit">表示範囲に合わせる</button></div><div class="field"><label>学校種別で絞り込み</label><div id="types" class="types"></div></div><div class="status" id="status">同じフォルダ内のGeoJSONを読み込みます。</div><label class="filebtn" for="fileInput">GeoJSONを手動で選択</label><input type="file" id="fileInput" accept=".geojson,.json,application/geo+json,application/json"><p class="muted">地図の表示にはインターネット接続が必要です。HTMLを直接開いて自動読込が失敗した場合は、上のボタンからGeoJSONを選択してください。</p></aside><main id="map" aria-label="東京都の学校位置を示す地図"></main></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const GEOJSON_FILE='P29-23_13.geojson';
const categories=[
['16001','小学校','#2563eb'],['16002','中学校','#16a34a'],['16003','中等教育学校','#0d9488'],['16004','高等学校','#ea580c'],['16005','高等専門学校','#a16207'],['16006','短期大学','#7c3aed'],['16007','大学','#9333ea'],['16011','幼稚園','#db2777'],['16012','特別支援学校','#0891b2'],['16013','幼保連携型認定こども園','#e11d48'],['16014','義務教育学校','#4f46e5'],['16015','各種学校','#64748b'],['16016','専修学校','#ca8a04']
];
const categoryMap=new Map(categories.map(x=>[x[0],{name:x[1],color:x[2]}]));
const map=L.map('map',{preferCanvas:true}).setView([35.68,139.69],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19}).addTo(map);
const cluster=L.markerClusterGroup({chunkedLoading:true,chunkInterval:100,chunkDelay:20,showCoverageOnHover:false,maxClusterRadius:48});map.addLayer(cluster);
let records=[];let selected=new Set(categories.map(x=>x[0]));let updateTimer;
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(s,error=false){$('status').textContent=s;$('status').className='status'+(error?' error':'');}
function drawTypes(){const counts=new Map();for(const r of records)counts.set(r.code,(counts.get(r.code)||0)+1);$('types').innerHTML=categories.map(([code,name,color])=>`<label class="type"><input type="checkbox" data-code="${code}" ${selected.has(code)?'checked':''}><span class="dot" style="background:${color}"></span><span>${name}</span><span class="count">${(counts.get(code)||0).toLocaleString('ja-JP')}</span></label>`).join('');$('types').querySelectorAll('input').forEach(el=>el.addEventListener('change',()=>{if(el.checked)selected.add(el.dataset.code);else selected.delete(el.dataset.code);refresh();}));}
function refresh(){const q=$('search').value.trim().toLocaleLowerCase('ja-JP');cluster.clearLayers();const filtered=records.filter(r=>selected.has(r.code)&&(!q||r.search.includes(q)));cluster.addLayers(filtered.map(r=>r.marker));$('visible').textContent=filtered.length.toLocaleString('ja-JP');setStatus(`${filtered.length.toLocaleString('ja-JP')} 件を表示しています。`);}
function fit(){const bounds=cluster.getBounds();if(bounds.isValid())map.fitBounds(bounds.pad(.07),{maxZoom:15});}
function loadData(data){if(data?.type!=='FeatureCollection'||!Array.isArray(data.features))throw Error('FeatureCollection形式のGeoJSONではありません。');records=[];let invalid=0;for(const f of data.features){if(f?.geometry?.type!=='Point'||!Array.isArray(f.geometry.coordinates)){invalid++;continue;}const [lon,lat]=f.geometry.coordinates.map(Number);if(!Number.isFinite(lon)||!Number.isFinite(lat)||Math.abs(lat)>90||Math.abs(lon)>180){invalid++;continue;}const p=f.properties||{};const code=String(p.P29_003??'');const category=categoryMap.get(code)||{name:'その他',color:'#64748b'};const name=String(p.P29_004??'名称不明');const address=String(p.P29_005??'住所不明');const marker=L.circleMarker([lat,lon],{radius:7,color:'#fff',weight:1.5,fillColor:category.color,fillOpacity:.92});marker.bindPopup(`<div class="popup-title">${safe(name)}</div><div class="popup-line"><b>学校種別：</b>${safe(category.name)}<br><b>住所：</b>${safe(address)}</div><div class="popup-code">学校コード：${safe(p.P29_002)}<br>分類コード：${safe(code)}${p.P29_009?'<br>補足：'+safe(p.P29_009):''}</div>`,{maxWidth:320});records.push({code,marker,search:(name+' '+address+' '+category.name).toLocaleLowerCase('ja-JP')});}drawTypes();$('total').textContent=`全 ${records.length.toLocaleString('ja-JP')} 件の施設${invalid?'（対象外 '+invalid+' 件）':''}`;refresh();fit();}
$('search').addEventListener('input',()=>{clearTimeout(updateTimer);updateTimer=setTimeout(refresh,180);});$('all').addEventListener('click',()=>{selected=new Set(categories.map(x=>x[0]));drawTypes();refresh();});$('none').addEventListener('click',()=>{selected.clear();drawTypes();refresh();});$('fit').addEventListener('click',fit);
$('fileInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{loadData(JSON.parse(await file.text()));setStatus(`${file.name} を読み込みました。`);}catch(err){setStatus('ファイルの読み込みに失敗しました：'+err.message,true);}});
(async()=>{try{const response=await fetch(GEOJSON_FILE);if(!response.ok)throw Error('HTTP '+response.status);loadData(await response.json());}catch(err){setStatus('自動読み込みができませんでした。HTMLとGeoJSONを同じフォルダに置き、「GeoJSONを手動で選択」からファイルを指定するか、ローカルサーバーで開いてください。',true);drawTypes();}})();
</script></body></html>
